name: Set Vault Status Manual

permissions:
  contents: write
  pull-requests: write

on:
  workflow_dispatch:
    inputs:
      status:
        description: 'Status to set'
        required: true
        type: choice
        options:
          - eol
          - active
          - paused
      reason:
        description: 'Reason code for pause/retire (optional)'
        required: true
        type: choice
        options:
          - tvl
          - rewards
          - exploit
          - upgrade
          - exploitNoPanic
          - liquidityPanic
          - liquidityNoPanic
          - withdraw
          - viability
          - noReason
      vaults:
        description: 'Comma-separated list of vault IDs'
        required: true
        type: string
      includeRelated:
        description: 'Include related vaults (vault/rp variants)'
        required: false
        type: boolean
        default: false
      chain:
        description: 'Consider only this chain (optional)'
        required: false
        type: string

jobs:
  set-vault-status:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Set Vault Status
        # never interpolate user input
        env:
          INPUT_STATUS: ${{ github.event.inputs.status }}
          INPUT_REASON: ${{ github.event.inputs.reason }}
          INPUT_CHAIN: ${{ github.event.inputs.chain }}
          INPUT_VAULTS: ${{ github.event.inputs.vaults }}
          INPUT_INCLUDE_RELATED: ${{ github.event.inputs.includeRelated }}
        run: |
          # Build the argument list; each value stays exactly one argument
          set -- --status "$INPUT_STATUS"

          # Optionally include chain argument
          if [ -n "$INPUT_CHAIN" ]; then
            set -- "$@" --chain "$INPUT_CHAIN"
          fi

          # Optionally include reason argument; "noReason" means leave the reason code unset
          if [ -n "$INPUT_REASON" ] && [ "$INPUT_REASON" != "noReason" ]; then
            set -- "$@" --reason "$INPUT_REASON"
          fi

          # Optionally include includeRelated argument
          if [ "$INPUT_INCLUDE_RELATED" = "true" ]; then
            set -- "$@" --includeRelated
          fi

          # Convert comma-separated vault ids into repeated --vaults arguments
          set -f     # no globbing while splitting
          IFS=', '   # split on commas, absorb surrounding spaces
          for VAULT_ID in $INPUT_VAULTS; do
            if [ -n "$VAULT_ID" ]; then
              set -- "$@" --vaults "$VAULT_ID"
            fi
          done
          set +f
          unset IFS

          npm run setVaultStatus -- -- "$@"

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: 'chore: update vault status of ${{ github.event.inputs.vaults }}'
          title: 'Update vault status of ${{ github.event.inputs.vaults }}'
          body: |
            Vault Status Update:
            - Chain: ${{ github.event.inputs.chain }}
            - Status: ${{ github.event.inputs.status }}
            - Reason: ${{ github.event.inputs.reason || 'N/A' }}
            - Vaults: ${{ github.event.inputs.vaults }}
            - Include Related: ${{ github.event.inputs.includeRelated }}
            - Triggered by: @${{ github.actor }}
          branch: vault-status-${{ github.actor }}-${{ github.event.inputs.status }}-${{ github.run_id }}
          delete-branch: true
