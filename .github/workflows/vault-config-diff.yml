name: Vault Config Diff

# Comments on pull requests with a summary of the changes made to src/config/vault/*.json.
#
# SECURITY - read before editing:
#
# pull_request_target runs this workflow from the default branch and gives it the base repository's
# token. That is only safe because NO PULL REQUEST CODE IS EVER EXECUTED here:
#   * the checkout has no `ref:`/`repository:`, so it is the base repo's default branch
#   * the pull request's commits are fetched into a throwaway bare repository under RUNNER_TEMP and
#     read with `git show`, as data, never checked out and never run
#   * the job that installs and runs anything holds no write token; only the comment job does
# DO NOT add a checkout of the pull request, do not run anything from $PR_COMMIT, and do not move
# the install/render steps into the comment job.
# See https://docs.github.com/en/actions/reference/security/securely-using-pull_request_target

permissions: {}

on:
  pull_request_target:
    # `edited` so retargeting a pull request onto main is picked up
    types: [opened, synchronize, reopened, edited]
    branches:
      - main
      - prod

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    # deliberately no write access: everything that installs or executes code happens in this job
    permissions:
      contents: read
    timeout-minutes: 15

    steps:
      # no ref: => the base repository's default branch, which is trusted code
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Find where the PR split from the target branch
        id: split
        env:
          GH_TOKEN: ${{ github.token }}
          # the branch the PR wants to merge into, as it is right now
          TARGET_BRANCH: ${{ github.event.pull_request.base.ref }}
          # the commit that branch was on when this run was triggered, which cannot move under us
          TARGET_BRANCH_AT_START: ${{ github.event.pull_request.base.sha }}
          # the last commit of the PR
          PR_COMMIT: ${{ github.event.pull_request.head.sha }}
        run: |
          # Find commit that this pr is based on
          find_split_from() {
            gh api "repos/$GITHUB_REPOSITORY/compare/$1...$PR_COMMIT" --jq '.merge_base_commit.sha'
          }

          split_commit="$(find_split_from "$TARGET_BRANCH")"

          # The PR was merged between the event firing and this step
          if [ "$split_commit" = "$PR_COMMIT" ]; then
            echo "::notice::$TARGET_BRANCH now contains $PR_COMMIT, using $TARGET_BRANCH_AT_START"
            split_commit="$(find_split_from "$TARGET_BRANCH_AT_START")"
          fi

          # Not found
          if ! echo "$split_commit" | grep -Eq '^[0-9a-f]{40}$' ||
            [ "$split_commit" = "$PR_COMMIT" ]; then
            echo "::error::Could not find where $PR_COMMIT split from $TARGET_BRANCH"
            exit 1
          fi

          # A throwaway repository to read the pr files from
          git init --bare --quiet "$RUNNER_TEMP/diff.git"
          git --git-dir="$RUNNER_TEMP/diff.git" remote add origin \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git --git-dir="$RUNNER_TEMP/diff.git" fetch --no-tags --depth=1 \
            origin "$split_commit" "$PR_COMMIT"

          echo "commit=$split_commit" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Diff vault configs
        env:
          # every git command the script runs resolves against the throwaway repository
          GIT_DIR: ${{ runner.temp }}/diff.git
          SPLIT_COMMIT: ${{ steps.split.outputs.commit }}
          PR_COMMIT: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p ./vault-config-diff
          ./node_modules/.bin/vite-node ./scripts/vaultConfigDiff.ts -- \
            --base "$SPLIT_COMMIT" \
            --head "$PR_COMMIT" \
            --output ./vault-config-diff/comment.md

      - name: Add to job summary
        if: always()
        run: cat ./vault-config-diff/comment.md >> "$GITHUB_STEP_SUMMARY"

      # always: a non-zero exit means the config is malformed, and the summary says which entries,
      # so it still needs to reach the comment even though the check is failing
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: vault-config-diff
          path: ./vault-config-diff/
          retention-days: 1

  comment:
    needs: render
    # run on failure too
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    # do not checkout/run code from the PR here
    permissions:
      pull-requests: write
    timeout-minutes: 10

    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        # the render job may have failed on malformed config while still producing the summary
        continue-on-error: true
        with:
          name: vault-config-diff
          path: ${{ runner.temp }}/vault-config-diff

      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          DIFF_DIR: ${{ runner.temp }}/vault-config-diff
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const marker = '<!-- vault-config-diff -->';
            // GitHub rejects comment bodies longer than 65536 characters
            const maxBodyChars = 65000;
            const pr = context.payload.pull_request;
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            // name the commit, so a comment left over from an earlier push cannot read as current
            const header = `${marker}\n<sub><code>${pr.head.sha.slice(0, 7)}</code> · <a href="${runUrl}">run</a></sub>\n\n`;

            const file = path.join(process.env.DIFF_DIR, 'comment.md');
            let body;
            if (!fs.existsSync(file)) {
              body = `${header}Could not generate the vault config summary for \`${pr.head.sha.slice(0, 7)}\`. See the [run](${runUrl}).\n`;
            } else {
              // read max bytes, slice to max characters 
              const limit = maxBodyChars - header.length;
              const handle = fs.openSync(file, 'r');
              const buffer = Buffer.alloc(limit * 4);
              const read = fs.readSync(handle, buffer, 0, limit * 4, 0);
              fs.closeSync(handle);

              const text = buffer.subarray(0, read).toString('utf8');
              // the notice goes in the header, which is always outside every <details> block
              body =
                text.length > limit ?
                  `${header}_Summary truncated._\n\n${text.slice(0, limit)}`
                : `${header}${text}`;
            }

            // our comment should always be in the first page
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo,
              issue_number: pr.number,
              per_page: 100,
            });
            const existing = comments.find(
              comment =>
                comment.user?.login === 'github-actions[bot]' && comment.body?.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: pr.number,
                body,
              });
            }
